<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elide · Edit pages before you print</title>
<meta name="description" content="Remove ads, menus and clutter from any web page, then print or save a clean PDF.">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg: #faf8f5; --fg: #22201d; --muted: #6f6961; --line: #e3ded6; --accent: #c8442b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1c1a; --fg: #ece8e2; --muted: #a39c93; --line: #36332f; --accent: #e0644a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 96px 20px 80px; text-align: center; }
  h1 { font-size: 44px; margin: 20px 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); font-size: 19px; margin: 0 auto; max-width: 520px; }
  nav { margin-top: 48px; display: flex; gap: 24px; justify-content: center; font-size: 15px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.svg" width="96" height="96" alt="">
  <h1>Elide</h1>
  <p>Remove ads, menus and clutter from any web page, then print or save a clean PDF. Nothing leaves your computer.</p>
  <nav><a href="privacy.html">Privacy policy</a><a href="mailto:elide.extension@gmail.com">Contact</a></nav>
</main>
</body>
</html>
